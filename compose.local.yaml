# LOCAL ONLY. Run explicitly with -f compose.local.yaml; never merge into production.
# Contains no credentials. server/.env is injected at runtime, never copied.
name: fixit
services:
  server:
    image: fixit-server:local
    build:
      context: ./server
      target: runtime
    env_file: [./server/.env]
    environment:
      NODE_ENV: development
      PORT: "5000"
      FIXIT_CONTAINER: "false"
      FIXIT_LOCAL_CONTAINER: "true"
      CLIENT_URL: http://localhost:8080
      TRUST_PROXY: "172.30.75.10"
      SMTP_ALLOW_INSECURE: "false"
    expose: ["5000"]
    networks:
      app:
        ipv4_address: 172.30.75.20
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    stop_grace_period: 30s
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  client:
    image: fixit-client:local
    build:
      context: ./client
      target: runtime
    # Fixed loopback only, deliberately no public binding/port override variable.
    ports: ["127.0.0.1:8080:8080"]
    volumes:
      - ./client/nginx.local.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      server: {condition: service_healthy}
    networks:
      app:
        ipv4_address: 172.30.75.10
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

networks:
  app:
    ipam:
      config:
        - subnet: 172.30.75.0/24
          gateway: 172.30.75.1
