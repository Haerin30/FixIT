name: fixit
services:
  server:
    image: fixit-server:${FIXIT_IMAGE_TAG:-local}
    build:
      context: ./server
      target: runtime
    env_file:
      - ${FIXIT_ENV_FILE:-./server/.env}
    environment:
      NODE_ENV: production
      PORT: "5000"
      FIXIT_CONTAINER: "true"
      TRUST_PROXY: "172.30.75.10"
      SMTP_ALLOW_INSECURE: "false"
    expose: ["5000"]
    networks:
      app:
        ipv4_address: 172.30.75.20
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    stop_grace_period: 30s
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  client:
    image: fixit-client:${FIXIT_IMAGE_TAG:-local}
    build:
      context: ./client
      target: runtime
    ports: ["127.0.0.1:${FIXIT_HTTP_PORT:-8080}:8080"]
    depends_on:
      server: {condition: service_healthy}
    networks:
      app:
        ipv4_address: 172.30.75.10
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  migrate:
    image: fixit-migrate:${FIXIT_IMAGE_TAG:-local}
    build:
      context: ./server
      target: migration
    profiles: [tools]
    env_file:
      - ${FIXIT_MIGRATION_ENV_FILE:-./server/.env}
    networks: [app]
    init: true
    restart: "no"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

networks:
  # Not internal:true: the API needs outbound Supabase, SMTP and PayMongo access.
  # No API port is published; only host-loopback Nginx is published.
  app:
    ipam:
      config:
        - subnet: 172.30.75.0/24
          gateway: 172.30.75.1
