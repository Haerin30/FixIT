worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    server_tokens off;
    # Omit query strings, authorization and request bodies from access logs.
    log_format safe '$remote_addr $request_method $uri $status';
    access_log /dev/stdout safe;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Only the host TLS proxy via the Compose gateway may supply client IPs.
    # Keep these addresses synchronized with compose.yaml.
    set_real_ip_from 172.30.75.1;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    server {
        listen 8080;
        root /usr/share/nginx/html;
        index index.html;
        client_max_body_size 32k;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Cache-Control no-store always;

        location = /healthz { access_log off; default_type text/plain; return 200 'ok\n'; }
        location = /api { return 308 /api/; }
        location /api/ {
            set $api_backend http://server:5000;
            proxy_pass $api_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            # Overwrite any untrusted incoming forwarding chain.
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_connect_timeout 5s;
            proxy_read_timeout 25s;
            proxy_hide_header Referrer-Policy;
            proxy_hide_header Cache-Control;
        }
        location / { try_files $uri $uri/ /index.html; }
    }
}
